name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the one in flight rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest

    env:
      # Font Awesome Pro packages need this; see .npmrc.
      FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
      # The site has its own domain (public/CNAME), so it is served from the root. Without
      # one, GitHub Pages serves a project site under the repository's name and this would
      # be /${{ github.event.repository.name }}/ instead.
      NUXT_APP_BASE_URL: /

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Nothing broken is published.
      - run: bun test

      - run: bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
